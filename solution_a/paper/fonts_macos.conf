<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <alias><family>SimSun</family><prefer><family>Songti SC</family></prefer></alias>
  <alias><family>SimHei</family><prefer><family>Heiti SC</family></prefer></alias>
  <alias><family>Cambria Math</family><prefer><family>STIX Two Math</family></prefer></alias>
  <alias><family>Consolas</family><prefer><family>Menlo</family></prefer></alias>
</fontconfig>
